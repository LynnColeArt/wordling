directives:
  directives:
  - id: WL-001
    title: Original format permanently
    description: Preserve original WP 5.1 native and companion formats in both missions;
      Wordling 5.2 is not a file-format version. Follow docs/compatibility.md.
    severity: error
    references: []
  - id: WL-002
    title: Parity before modernization
    description: M1 delivers complete plain WP 5.1 DOS parity. M2 begins after M1
      acceptance and adds PDF export and selected conveniences. See docs/roadmap.md.
    severity: error
    references: []
  - id: WL-003
    title: Lossless and safe saves
    description: No-edit saves are byte-identical. Edits preserve unrelated content.
      Unknown data is preserved or unsafe edits/saves are refused before replacing
      the original.
    severity: error
    references: []
  - id: WL-004
    title: Evidence before compatibility claims
    description: Track manual discovery, section study, original-app observation,
      implementation, and differential verification separately. Declare exact reference
      release and resources.
    severity: error
    references: []
  - id: WL-005
    title: Go and Bubble Tea on Linux
    description: Implement the application in Go using Bubble Tea. Keep terminal rendering
      independent of document and layout semantics.
    severity: error
    references: []
  - id: WL-006
    title: Verification and provenance
    description: Changed Go code passes formatting, build, go test ./..., go vet ./...;
      binary readers need malformed-input and fuzz tests; writers need original-app
      checks. Do not redistribute proprietary references without permission.
    severity: error
    references: []
  - id: WL-007
    title: Complete coverage stays visible
    description: Inventory all original functionality including utilities and platform-dependent
      behavior. Record explicit Linux adaptations and owner-approved scope decisions;
      do not silently omit difficult features.
    severity: error
    references: []
