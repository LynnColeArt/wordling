[build-system]
requires = ["setuptools==68.1.2", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wordling-reference-controller-original-route"
version = "0.1.0"
requires-python = ">=3.12"
description = "Bounded ROOT-admitted reference route; CONTROL is not original evidence"
license = {text = "Apache-2.0"}

[tool.setuptools]
packages = ["reference_controller", "startup_family"]
py-modules = ["startup_transport", "peer", "boundaries", "qmp"]
package-dir = {reference_controller = "reference_controller", startup_family = "startup_family"}
include-package-data = false

[tool.setuptools.package-data]
reference_controller = ["originaldata/control-fixture", "originaldata/control-master.bin", "originaldata/roster.json"]
