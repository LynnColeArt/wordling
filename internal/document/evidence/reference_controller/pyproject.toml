[build-system]
requires = ["setuptools==68.1.2", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wordling-reference-controller-test"
version = "0.2.0"
requires-python = ">=3.12"
description = "Bounded one-leaf harmless TEST controller; original execution disabled"
license = {text = "Apache-2.0"}

# Trusted offline preparation stages the exact reviewed sources under these
# ordinary names, with an exhaustive source map. No runtime source overlays.
[tool.setuptools]
packages = ["reference_controller", "startup_family"]
py-modules = ["startup_transport", "peer", "boundaries", "qmp"]
package-dir = {reference_controller = "reference_controller", startup_family = "startup_family"}
include-package-data = false

[tool.setuptools.package-data]
reference_controller = ["testdata/fixture", "testdata/master.bin"]
